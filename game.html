<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Galactic Typing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Start Typing!</h2>
        <div id="sample-text"></div>
        <textarea id="typing-area" rows="10" style="width: 95%; opacity: 0.5;" autofocus></textarea>
        <div style="margin-top: 20px;">
            <h3>WPM: <span id="wpm">0</span></h3>
            <h3>Accuracy: <span id="accuracy">100</span>%</h3>
        </div>
    </div>

    <script>
        const sampleTextElement = document.getElementById('sample-text');
        const typingArea = document.getElementById('typing-area');
        const wpmElement = document.getElementById('wpm');
        const accuracyElement = document.getElementById('accuracy');

        const sampleText = "The quick brown fox jumps over the lazy dog. A journey of a thousand miles begins with a single step. To be or not to be, that is the question.";
        
        let charSpans;
        let currentIndex = 0;
        let startTime;
        let correctStrokes = 0;
        let totalStrokes = 0;

        function initializeGame() {
            sampleTextElement.innerHTML = ''; // Clear previous text
            sampleText.split('').forEach(char => {
                const span = document.createElement('span');
                span.innerText = char;
                sampleTextElement.appendChild(span);
            });
            charSpans = sampleTextElement.querySelectorAll('span');
            charSpans[0].classList.add('current');
            typingArea.value = '';
            typingArea.focus();
            resetMetrics();
        }

        function resetMetrics() {
            currentIndex = 0;
            startTime = null;
            correctStrokes = 0;
            totalStrokes = 0;
            wpmElement.innerText = '0';
            accuracyElement.innerText = '100';
        }

        typingArea.addEventListener('input', (e) => {
            if (!startTime) {
                startTime = new Date();
            }

            const typedText = typingArea.value;
            
            // Handle backspace
            if (e.inputType === 'deleteContentBackward') {
                if (currentIndex > 0) {
                    currentIndex--;
                    charSpans[currentIndex].classList.remove('correct', 'incorrect', 'current');
                    if(charSpans[currentIndex + 1]) {
                        charSpans[currentIndex + 1].classList.remove('current');
                    }
                    charSpans[currentIndex].classList.add('current');
                }
                // Recalculate metrics on backspace
                totalStrokes = typedText.length;
                correctStrokes = 0;
                for(let i = 0; i < typedText.length; i++) {
                    if (typedText[i] === sampleText[i]) {
                        correctStrokes++;
                    }
                }
                updateMetrics();
                return;
            }


            const typedChar = typedText[typedText.length - 1];
            const sampleChar = charSpans[currentIndex].innerText;

            totalStrokes++;

            charSpans[currentIndex].classList.remove('current');

            if (typedChar === sampleChar) {
                charSpans[currentIndex].classList.add('correct');
                correctStrokes++;
            } else {
                charSpans[currentIndex].classList.add('incorrect');
            }

            currentIndex++;

            updateMetrics();

            if (currentIndex === charSpans.length) {
                finishGame();
                return;
            }
            
            if (charSpans[currentIndex]) {
                 charSpans[currentIndex].classList.add('current');
            }
        });
        
        function updateMetrics() {
            const elapsedTime = (new Date() - startTime) / 1000 / 60; // in minutes
            if (elapsedTime > 0) {
                const wpm = Math.round(((correctStrokes / 5) / elapsedTime));
                wpmElement.innerText = wpm;
            }
            
            const accuracy = totalStrokes > 0 ? Math.round((correctStrokes / totalStrokes) * 100) : 100;
            accuracyElement.innerText = accuracy;
        }

        function finishGame() {
            const finalWPM = wpmElement.innerText;
            const finalAccuracy = accuracyElement.innerText;

            localStorage.setItem('finalWPM', finalWPM);
            localStorage.setItem('finalAccuracy', finalAccuracy);

            window.location.href = 'results.html';
        }

        initializeGame();
    </script>
</body>
</html>
