<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Galactic Typing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Race Finished!</h1>
        <h3>WPM: <span id="final-wpm">0</span></h3>
        <h3>Accuracy: <span id="final-accuracy">0</span>%</h3>
        <a href="menu.html"><button>Back to Menu</button></a>
    </div>

    <script>
        window.addEventListener('load', () => {
            const finalWPM = localStorage.getItem('finalWPM');
            const finalAccuracy = localStorage.getItem('finalAccuracy');

            const wpmElement = document.getElementById('final-wpm');
            const accuracyElement = document.getElementById('final-accuracy');

            if (finalWPM) {
                wpmElement.innerText = finalWPM;
            }
            if (finalAccuracy) {
                accuracyElement.innerText = finalAccuracy;
            }
        });
    </script>
</body>
</html>
