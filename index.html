<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Typing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: #1e1926;
            color: #b7a2d7;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px #4214f2, 0 0 20px #4214f2;
        }

        .player-status {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #362b48;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #4214f2;
        }

        .player-status p {
            margin: 0.5rem 0;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 300px;
        }

        .btn {
            background-color: #362b48;
            color: #b7a2d7;
            border: 2px solid #4214f2;
            padding: 1rem;
            font-size: 1rem;
            font-family: 'Roboto Mono', monospace;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
            text-align: center;
        }

        .btn:hover {
            background-color: #4214f2;
            color: #ffffff;
            box-shadow: 0 0 15px #4214f2;
        }
    </style>
</head>
<body>

    <div class="player-status">
        <p>Welcome, E_HAN</p>
        <p>Level: 12</p>
        <p>Status: Online</p>
    </div>

    <h1 class="main-title">GALACTIC TYPING</h1>

    <div class="menu-buttons">
        <button class="btn">Find Match (Quick Play)</button>
        <button class="btn">Private Race (Invite Friends)</button>
        <button class="btn">Leaderboards</button>
        <button class="btn">Solo Practice</button>
    </div>

</body>
</html>
