<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Fins -->
  <path d="M120 350 L80 450 L150 420 Z" fill="#ef4444" />
  <path d="M392 350 L432 450 L362 420 Z" fill="#ef4444" />
  <path d="M256 350 L256 450 L256 420" stroke="#ef4444" stroke-width="20" />
  
  <!-- Main Body -->
  <ellipse cx="256" cy="250" rx="100" ry="200" fill="url(#rocketBody)" />
  
  <!-- Window -->
  <circle cx="256" cy="200" r="40" fill="#1f2937" stroke="#e5e7eb" stroke-width="5" />
  <circle cx="256" cy="200" r="30" fill="url(#window)" />
  
  <!-- Flame -->
  <path d="M220 440 Q256 600 292 440" fill="url(#flame)" />
</svg>