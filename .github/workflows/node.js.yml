name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint: # Renamed job for clarity
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] # Testing against one version is usually enough for CI checks

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # New step to run the linter
    - name: Run linter
      run: npm run lint

    # Changed this step to use your build script
    - name: Run build
      run: npm run build
